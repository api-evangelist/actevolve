description: >-
  Negative probe record for ActEvolve Inc. (株式会社ActEvolve), which renamed itself
  VARK Inc. (株式会社VARK) on 2020-05-01. The company's entertainment-VR platform
  "VARK" was shut down on 2024-03-04 and the whole company was sold in an
  undisclosed all-share transaction completed in March 2025. Every host the company
  ever used — vark.co.jp (the service), corp.vark.co.jp (the corporate site) and
  actevolve.com (the original brand domain) — has been switched off at DNS: the
  zones still exist and the registrations are still in the company's name, but no
  A/AAAA/CNAME record is published for any web hostname, so no HTTP request can be
  made against them at all. Nothing is emitted from this probe: no WellKnown, no
  SecurityTxt, no LLMsTxt, no AgentCard, no MCPServer, no OpenAPI pointer, and none
  should ever be emitted from it in a later round.

