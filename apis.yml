x-domain-status: offline
x-domain-note: >-
  vark.co.jp is still registered to 株式会社VARK at JPRS (created 2018-09-10, Connected
  through 2026-09-30, record last updated 2025-10-17) and actevolve.com is still
  registered via GoDaddy on Route 53 name servers (created 2017-05-31, expiring
  2027-05-31), but neither zone publishes an A, AAAA or CNAME record for any web
  hostname — authoritative queries return NOERROR/NODATA and curl exits 6 on every
  request. The vark.co.jp SOA serial decodes to 2025-03-06, the month the sale closed,
  and the only surviving record is an MX pointing at Google Workspace. corp.vark.co.jp
  (the corporate site) was last captured by the Wayback Machine on 2025-02-09. No host
  is wired as a Website pointer because none of them serves anything, and the EquityZen
  page this company was harvested from is a trading venue's listing, not a company web
  presence (roadmap#56).
