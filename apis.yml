aid: actevolve
name: ActEvolve
description: >-
  ActEvolve Inc. (株式会社ActEvolve) was a Tokyo virtual-reality entertainment company
  incorporated on 9 August 2017 by Takuya Kato, a former Capcom game developer, together
  with other ex-game-industry engineers. In November 2018 it launched VARK, a VR live
  platform on which VTuber and virtual-artist performances — most visibly the long-running
  "Cinderella switch" series with hololive — were staged as ticketed, seat-based concerts
  for Meta Quest, Android and iOS, paid for with in-app VARK Coin. The company took
  strategic investment from KLab Inc. in August 2019, renamed itself VARK Inc.
  (株式会社VARK) on 1 May 2020 alongside a roughly ¥200M round from ANRI, raised a further
  ¥600M in May 2021, and diversified into the VARK SHORTS 3D animation tool and the STAR
  BLOOM liver-management agency, producing metaverse events for ANYCOLOR, Avex, KADOKAWA,
  COVER, Dwango, Shochiku and Meta. VARK was a consumer entertainment app rather than a
  platform business: it never operated a developer program, and no public API, SDK, webhook
  catalogue or machine-readable specification (OpenAPI, AsyncAPI, GraphQL SDL, MCP manifest,
  agent card) was published on any of its hosts at any point — 1,812 archived URLs across
  vark.co.jp and its subdomains contain no /api, /developers, /docs, /openapi or /graphql
  path of any kind. The VARK metaverse service shut down on 4 March 2024 with same-day
  notice, refunding unused VARK Coin until 5 May 2024 under Japan's Payment Services Act;
  the free tier of VARK SHORTS ended on 30 September 2024; and in March 2025 the entire
  company was sold in an all-share transaction whose acquirer and terms were kept
  confidential, with founder Takuya Kato stepping down as representative director. This
  profile is retained as a historical record — there is no API surface to enrich.
